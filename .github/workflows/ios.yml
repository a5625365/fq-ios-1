          +
          +/// 锁屏 / 控制中心的「正在播放」桥。
          +///
          +/// 两件事在 Dart 侧做不到，必须原生实现：
          +///   1. `AVAudioSession` 设成 `.playback` 并激活 —— 否则锁屏后 iOS 会挂起进程，
          +///      Rust 核心的本地解密流断掉，播放器几秒后报「播放出错」；
          +///   2. `MPNowPlayingInfoCenter` + `MPRemoteCommandCenter` —— 锁屏和通知栏的
          +///      播放条、封面、进度、以及耳机线控/锁屏按钮的回调。
          +///
          +/// 通道：`fqapp/ios_playback`
          +///   Dart → 原生：startListenForeground / stopListenForeground / configure
          +///   原生 → Dart：remoteAction({action, positionMs?})，由 Dart 转成播放器已有的
          +///   `onNotificationAction` 指令，复用 Android 前台服务那一套处理逻辑。
          +final class PlaybackBridge {
          +  private static var channel: FlutterMethodChannel?
          +  private static var commandsInstalled = false
          +  private static var coverTask: URLSessionDataTask?
          +  private static var hasPrev = true
          +  private static var hasNext = true
          +
          +  /// 只配置一次全局音频会话；重复调用是安全的。
          +  static func configureAudioSession() {
          +    let session = AVAudioSession.sharedInstance()
          +    do {
          +      try session.setCategory(.playback, mode: .spokenAudio, options: [])
          +      try session.setActive(true)
          +    } catch {
          +      NSLog("fqapp playback: audio session failed \(error.localizedDescription)")
          +    }
          +    NotificationCenter.default.addObserver(
          +      forName: AVAudioSession.interruptionNotification,
          +      object: session,
          +      queue: .main
          +    ) { note in
          +      guard
          +        let raw = note.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt,
          +        let type = AVAudioSession.InterruptionType(rawValue: raw)
          +      else { return }
          +      switch type {
          +      case .began:
          +        // 别的 App 抢占音频（视频、语音、导航、来电）时，系统会直接停掉我们的
          +        // 会话。此时若不主动暂停，libmpv 会在失效的会话上继续输出，随即报错，
          +        // 表现就是「一有干扰就断开且不再继续」。
          +        notifyDartInterruption(began: true)
          +      case .ended:
          +        // 不论系统是否给出 shouldResume，都先重新激活会话：否则下一次播放
          +        // 会因为会话仍处于失效状态而立刻再次被打断。
