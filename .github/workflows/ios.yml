name: Build iOS IPA

# 在 GitHub 的 macOS runner 上构建可自签安装的 iPhone 版 fqapp（什锦铺）。
#
# 做法：把上游 ch6vip/fqapp 拉进 src/，再套用本仓库里的 fqapp-ios-full.patch
# （给 iOS 补上听书播放），最后产出一个未签名 IPA。
#
# 仓库里需要两个文件：
#   .github/workflows/ios.yml   本文件
#   fqapp-ios-full.patch        代码补丁（听书 + 短剧/漫剧视频）
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 上游仓库（换成分支/自己的 fork 也可以）
        type: string
        default: 'ch6vip/fqapp'
      source_ref:
        description: 分支或 tag
        type: string
        default: 'master'
      flutter_version:
        description: Flutter 版本（pubspec.lock 要求 >=3.47.0）
        type: string
        default: '3.50.0'
      rust_version:
        description: Rust 工具链版本
        type: string
        default: '1.99.1'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      # 补丁已内嵌在下面的步骤里，所以只需要拉一份上游源码。
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: src
          persist-credentials: false

      - name: Apply iOS full patch
        run: |
          set -euo pipefail
          PATCH=/tmp/ios-full.patch
          cat > "$PATCH" <<'PATCH_EOF'
          --- a/pubspec.yaml
          +++ b/pubspec.yaml
          @@ -63,6 +63,10 @@
             # Android/iOS/macOS/Linux 的播放库会一起进包（APK 多出 ~11 MB）。
             media_kit_libs_windows_video: 1.0.11
             media_kit_libs_linux: 1.2.1
          +  # iOS 的 libmpv（含视频解码）。上游原先没给 iOS 接播放器，听书和短剧一点就
          +  # MissingPluginException；这个包只对 iOS 生效，不进 Android 包体。
          +  # 不要同时加 ios_audio 版本，两者都带 libmpv，会重复链接。
          +  media_kit_libs_ios_video: 1.1.4
             file_selector: ^1.1.0
             flutter_tts: ^4.2.5
             webview_windows:
          --- a/rust/Cargo.toml
