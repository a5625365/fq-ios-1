          +      if (!disposed) emit({'playerId': id, 'type': 'error', 'value': desktopOpenFailure(id, error)});
          +    }
          +  }
          +
          +  Future<void> dispose() async {
          +    if (disposed) return;
          +    disposed = true;
          +    if (!_ready.isCompleted) _ready.complete();
          +    for (final subscription in _subscriptions) {
          +      await subscription.cancel();
          +    }
          +    try {
          +      await player.dispose();
          +    } finally {
          +      _media?.close();
          +      _media = null;
          +    }
          +  }
          +}
          --- /dev/null
          +++ b/lib/services/resilient_secure_key_storage.dart
          @@ -0,0 +1,123 @@
          +import 'dart:convert';
          +import 'dart:io';
          +
          +import 'package:path_provider/path_provider.dart';
          +
          +import 'app_log.dart';
          +import 'secure_key_storage.dart';
          +
          +/// 给原生密钥库兜底的一层。
          +///
          +/// 自签安装的 iOS 包常常读不到 Keychain：Sideloadly 用免费证书重签后，App 没有
          +/// `keychain-access-groups` entitlement，写入会直接报 `-34018`（missing entitlement）。
          +/// 上游 [SecureKeyProvider] 把所有异常都吞成 `null`，于是：
          +///
          +///   * Hive 加密缓存拿不到密钥 → 章节缓存/整本下载点了没反应；
          +///   * 设备池密钥下发不了 → Rust 侧 `fq_desktop_media_open` 与视频地址接口拿不到
          +///     可用设备 → 短剧/漫剧返回 500，界面提示「播放服务暂时不可用」。
          +///
          +/// 这里在原生存储失败时退回应用私有目录里的一个 JSON 文件。安全性弱于 Keychain
          +/// （没有硬件绑定、不随备份迁移），只在原生确实不可用时才启用，并且不会覆盖
          +/// 原生里已有的值。
          +class ResilientSecureKeyStorage implements SecureKeyStorage {
          +  ResilientSecureKeyStorage(this._primary);
          +
          +  final SecureKeyStorage _primary;
          +  final _fallback = _FileSecureKeyStorage();
          +  bool _degraded = false;
          +
          +  void _degrade(Object error) {
          +    if (_degraded) return;
          +    _degraded = true;
          +    AppLog.w('secure_keys', '原生密钥库不可用，改用本地文件兜底: $error');
          +  }
          +
          +  @override
          +  Future<String?> read(String key) async {
          +    try {
          +      final value = await _primary.read(key);
          +      if (value != null) return value;
          +      // 原生里没有：可能是之前写进了兜底文件，也要查一次。
          +      return await _fallback.read(key);
          +    } catch (error) {
          +      _degrade(error);
          +      return _fallback.read(key);
          +    }
          +  }
          +
          +  @override
          +  Future<void> write(String key, String value) async {
          +    try {
          +      await _primary.write(key, value);
          +      return;
          +    } catch (error) {
          +      _degrade(error);
          +    }
          +    await _fallback.write(key, value);
          +  }
          +
          +  @override
          +  Future<void> delete(String key) async {
          +    try {
          +      await _primary.delete(key);
          +    } catch (error) {
          +      _degrade(error);
          +    }
          +    await _fallback.delete(key);
          +  }
          +}
          +
          +/// 兜底实现：应用私有目录下的 JSON 映射。文件权限随沙箱，其他 App 读不到。
          +class _FileSecureKeyStorage implements SecureKeyStorage {
          +  static const _fileName = 'secure_keys_fallback.json';
          +  Map<String, String>? _cache;
          +
          +  Future<File> _file() async {
          +    final dir = await getApplicationSupportDirectory();
          +    return File('${dir.path}/$_fileName');
          +  }
          +
          +  Future<Map<String, String>> _load() async {
          +    final cache = _cache;
          +    if (cache != null) return cache;
          +    try {
          +      final file = await _file();
          +      if (!await file.exists()) return _cache = <String, String>{};
          +      final decoded = jsonDecode(await file.readAsString());
          +      final map = <String, String>{};
          +      if (decoded is Map) {
          +        for (final entry in decoded.entries) {
          +          final value = entry.value;
          +          if (value is String) map['${entry.key}'] = value;
          +        }
          +      }
          +      return _cache = map;
          +    } catch (_) {
          +      return _cache = <String, String>{};
          +    }
          +  }
          +
          +  Future<void> _save(Map<String, String> values) async {
          +    _cache = values;
          +    final file = await _file();
          +    await file.parent.create(recursive: true);
          +    await file.writeAsString(jsonEncode(values), flush: true);
          +  }
          +
          +  @override
          +  Future<String?> read(String key) async => (await _load())[key];
          +
          +  @override
          +  Future<void> write(String key, String value) async {
          +    final values = Map<String, String>.from(await _load());
          +    values[key] = value;
          +    await _save(values);
          +  }
          +
          +  @override
          +  Future<void> delete(String key) async {
          +    final values = Map<String, String>.from(await _load());
          +    values.remove(key);
          +    await _save(values);
          +  }
          +}
          PATCH_EOF
          echo "补丁行数: $(wc -l < "$PATCH")"
          git -c core.autocrlf=false apply --verbose "$PATCH"
          echo "--- 补丁生效检查 ---"
          grep -q "media_kit_libs_ios_video" pubspec.yaml && echo "pubspec OK"
          grep -q "isIOSPlatform" lib/pages/player_page.dart && echo "player_page OK"
          grep -q 'target_os = "ios"' rust/Cargo.toml && echo "cargo cfg OK"
          grep -q 'target_os = "ios"' rust/src/network.rs && echo "network cfg OK"
          grep -q "PlaybackBridge" ios/Runner/AppDelegate.swift && echo "playback bridge OK"
          grep -q "fqapp/ios_playback" lib/services/ios_platform.dart && echo "channel OK"
          test -f lib/services/ios_platform.dart && echo "ios_platform.dart OK"

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          echo "已安装的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sed -E 's#/Applications/Xcode(.*)\.app#\1#' \
            | sort -V | tail -1)
          if [ -z "${BEST}" ]; then echo "runner 上没有 Xcode"; exit 1; fi
          sudo xcode-select -s "/Applications/Xcode${BEST}.app/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}
          targets: aarch64-apple-ios

      - name: Cache cargo build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ios-cargo-${{ inputs.rust_version }}-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/**/*.rs', 'src/rust/build.rs') }}
          restore-keys: |
            ios-cargo-${{ inputs.rust_version }}-

      # 新版 Xcode + Swift Package Manager 有已知构建失败，上游 IOS.md 要求关掉。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager || echo "该 Flutter 版本不支持此开关，跳过"

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Resolve Dart dependencies
        run: |
          set -euo pipefail
          # 补丁改了 pubspec，lock 必然对不上，直接走普通 pub get 更新 lock。
          flutter pub get || { echo "pub get 失败"; exit 1; }

      # 把编译错误挡在昂贵的 Rust / Xcode 步骤之前，省 10 分钟。
      - name: Analyze touched Dart files
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/services/ios_platform.dart \
            lib/services/desktop_media.dart \
            lib/services/native_player.dart \
            lib/services/resilient_secure_key_storage.dart \
            lib/services/native_secure_key_storage.dart \
            lib/services/audio_playback_controller.dart \
            lib/main.dart

      # Rust 核心编成 staticlib → ios/Frameworks/libfqapi_core.a
      # 补丁放开了 desktop_media 在 iOS 上编译，C 解密核心（sp_stream / mp4_cenc）
      # 由 build.rs 一并编进来。
      - name: Build Rust core as iOS static library
        run: |
          set -euo pipefail
          chmod +x scripts/build_rust_ios.sh
          ./scripts/build_rust_ios.sh

      - name: Verify the static library
        run: |
          set -euo pipefail
          lipo -info ios/Frameworks/libfqapi_core.a
          size=$(stat -f%z ios/Frameworks/libfqapi_core.a)
          echo "libfqapi_core.a = ${size} bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "静态库异常偏小，Rust 构建没真正产出"; exit 1
          fi

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update 2>&1 | tail -40

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ../build-ios.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "Runner.app 不存在，构建失败"; exit 1; }
          # 主二进制里必须能找到 Rust 入口，找不到就是白屏。
          nm -gU "$APP/Runner" 2>/dev/null | grep -qi "frb\|fqapi" \
            || { echo "主二进制缺少 frb/fqapi 导出符号"; exit 1; }
          rm -rf /tmp/pack && mkdir -p /tmp/pack/Payload
          ditto "$APP" /tmp/pack/Payload/Runner.app
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          OUT="fqapp-ios-${VERSION}-full.ipa"
          (cd /tmp/pack && zip -qry "$OLDPWD/$OUT" Payload)
          ls -lh "$OUT"
          shasum -a 256 "$OUT" | tee SHA256SUMS.txt
          echo "IPA=src/$OUT" >> "$GITHUB_ENV"

      - name: Report build fingerprint
        run: |
          set -euo pipefail
          echo "source:  ${{ inputs.source_repo }}@${{ inputs.source_ref }} + ios-full.patch"
          echo "flutter: $(flutter --version | head -1)"
          echo "rustc:   $(rustc --version)"
          echo "xcode:   $(xcodebuild -version | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-ios-unsigned-ipa
          path: |
            ${{ env.IPA }}
            src/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build-ios.log
            src/build/ios/**/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
