          +import 'dart:async';
          +
          +import 'package:flutter/foundation.dart';
          +import 'package:flutter/services.dart';
          +import 'package:flutter/widgets.dart';
          +import 'package:media_kit/media_kit.dart';
          +import 'package:media_kit_video/media_kit_video.dart';
          +
          +import 'app_log.dart';
          +import 'desktop_media.dart';
          +import 'platform_channel.dart';
          +
          +bool get isIOSPlatform => !kIsWeb && defaultTargetPlatform == TargetPlatform.iOS;
          +
          +/// iOS 的 `fqapp/native_player` 适配层。
          +///
          +/// 上游只给 Android（ExoPlayer）和桌面（media_kit）实现了这条通道，iOS 的
          +/// Runner 里没有任何 Swift 侧实现，所以听书/短剧一开播就抛 MissingPluginException。
          +/// 这里不去补 Swift，而是在 Dart 里复刻同一份通道契约：
          +///
          +///   * 播放器用 media_kit（iOS 由 media_kit_libs_ios_video 提供 libmpv）；
          +///   * 画面走 media_kit_video 的 [VideoController]，和 Windows 端同一实现；
          +///   * 解密复用 Rust 核心的 `fq_desktop_media_open`，它把「CDN 地址 + key」
          +///     换成本机 127.0.0.1 上的明文流，和 Windows/Linux 完全同一条路径；
          +///   * 事件格式与 [NativePlayer] 读取的字段一一对应（type/value/playerId）。
          +///
          +/// `create` 回传的 playerId 同时充当「纹理 id」：`Texture` 在 iOS 上不可用，
          +/// 页面通过 [IosPlatform.videoSurface] 用这个 id 反查 [VideoController]。
          +class IosPlatform {
          +  static final _events = StreamController<Map<String, dynamic>>.broadcast();
          +  static final _players = <int, _IosPlayer>{};
          +  static int _nextId = 1;
          +  static bool _installed = false;
          +
          +  static Future<void> install() async {
          +    if (_installed) return;
          +    _installed = true;
          +    MediaKit.ensureInitialized();
          +    PlatformChannels.events = (name) {
          +      if (name == 'fqapp/native_player/events') return _events.stream;
          +      return const Stream<dynamic>.empty();
          +    };
          +    PlatformChannels.invoke = _invoke;
          +  }
          +
          +  /// 渲染视频画面。与 `DesktopPlatform.videoSurface` 同签名，页面按平台二选一。
          +  static Widget videoSurface(int id, {Key? key}) {
          +    final host = _players[id];
          +    if (host == null) return const SizedBox.expand();
          +    return Video(
          +      key: key,
          +      controller: host.video,
          +      controls: NoVideoControls,
          +      fit: BoxFit.fill,
          +      pauseUponEnteringBackgroundMode: false,
          +      resumeUponEnteringForegroundMode: false,
          +    );
          +  }
          +
          +  static Future<dynamic> _invoke(
          +    String channel,
          +    String method,
          +    dynamic arguments,
          +  ) async {
          +    if (channel != 'fqapp/native_player') {
          +      // 其余 fqapp/* 通道（system_tts、reader 亮度、分享等）在 iOS 上确实
          +      // 没有原生实现。保持与「没有适配层」时一致的 MissingPluginException，
          +      // 调用方已有的降级分支照常生效。
          +      throw MissingPluginException('$channel.$method');
          +    }
          +    final args = arguments is Map ? arguments : const <dynamic, dynamic>{};
          +    switch (method) {
          +      case 'create':
          +        final id = _nextId++;
          +        final host = _IosPlayer(id, _events.add);
          +        _players[id] = host;
          +        unawaited(
          +          host.open(
          +            args['cdnUrl'] as String? ?? '',
          +            args['keyHex'] as String? ?? '',
          +          ),
          +        );
          +        return <String, dynamic>{'playerId': id};
          +
          +      case 'dispose':
          +        final id = args['id'];
          +        if (id is num) {
          +          final host = _players.remove(id.toInt());
          +          if (host != null) await host.dispose();
          +        }
          +        return null;
          +
          +      // 系统媒体卡片 / 前台服务 / 悬浮窗都是 Android 专有概念，iOS 直接吞掉。
          +      case 'setKeepScreenOn':
          +      case 'startListenForeground':
          +      case 'stopListenForeground':
          +      case 'allocateFloatingOwner':
          +      case 'startFloating':
          +      case 'showFloating':
          +      case 'updateFloating':
          +      case 'stopFloating':
          +      case 'swapFloatingPlayer':
          +      case 'canDrawOverlays':
          +        return method == 'canDrawOverlays' ? false : null;
          +
          +      case 'play':
          +      case 'pause':
          +      case 'seek':
          +      case 'setRate':
          +      case 'setVolume':
          +        final id = args['id'];
          +        final host = id is num ? _players[id.toInt()] : null;
          +        if (host == null) return null;
          +        await host.command(method, args);
          +        return null;
          +
          +      default:
          +        // 未识别的播放器指令不抛异常：多出来的指令应当无副作用地跳过，
          +        // 而不是让整页报错。
          +        return null;
          +    }
          +  }
          +}
          +
          +class _IosPlayer {
          +  _IosPlayer(this.id, this.emit) {
          +    video = VideoController(player);
          +    unawaited(
          +      video.waitUntilFirstFrameRendered.then((_) => _event('firstFrame', true)),
          +    );
          +    _subscriptions.addAll([
          +      player.stream.position.listen((v) => _event('position', v.inMilliseconds)),
          +      player.stream.duration.listen((v) => _event('duration', v.inMilliseconds)),
          +      player.stream.playing.listen((v) => _event('playing', v)),
          +      player.stream.buffering.listen((v) => _event('buffering', v)),
          +      player.stream.completed.listen((v) => _event('completed', v)),
          +      player.stream.width.listen((_) => _size()),
          +      player.stream.height.listen((_) => _size()),
          +      player.stream.error.listen((message) {
          +        AppLog.w('ios-player', 'id=$id media error: $message');
          +        _event('error', {'message': '媒体播放失败，请重试或切换清晰度'});
          +      }),
          +    ]);
          +  }
          +
          +  final int id;
          +  final void Function(Map<String, dynamic>) emit;
          +  final player = Player();
          +  late final VideoController video;
          +  final _subscriptions = <StreamSubscription<dynamic>>[];
          +  final _ready = Completer<void>();
          +  DesktopMedia? _media;
          +  bool disposed = false;
          +
          +  void _event(String type, dynamic value) {
          +    if (!disposed) emit({'playerId': id, 'type': type, 'value': value});
          +  }
          +
          +  void _size() {
          +    if (disposed) return;
          +    // 与桌面端一致：rotationCorrection 恒为 0，media_kit 已经把旋转烘进画面。
          +    emit({
          +      'playerId': id,
          +      'type': 'videoSize',
          +      'width': player.state.width ?? 0,
          +      'height': player.state.height ?? 0,
          +      'rotationCorrection': 0,
          +    });
          +  }
          +
          +  Future<void> open(String url, String key) async {
          +    _ready.future.ignore();
          +    try {
          +      var playbackUrl = url;
          +      if (key.isNotEmpty) {
          +        final session = await DesktopMedia.open(url, key);
          +        if (disposed) {
          +          session.close();
          +          return;
          +        }
          +        _media = session;
          +        playbackUrl = session.url;
          +      }
          +      if (disposed) return;
          +      await player.open(Media(playbackUrl), play: false);
          +      if (disposed) return;
          +      if (!_ready.isCompleted) _ready.complete();
          +      // 纯音频同样回一个占位 id 当作「创建完成」，页面不会去取画面。
          +      _event('created', id);
          +      _size();
          +      AppLog.d('ios-player', 'id=$id opened');
          +    } catch (error) {
          +      if (!_ready.isCompleted) {
          +        _ready.completeError(StateError('无法打开媒体'));
          +      }
          +      final value = desktopOpenFailure(id, error);
          +      if (!disposed) {
          +        emit({'playerId': id, 'type': 'error', 'value': value});
          +      }
          +      _media?.close();
          +      _media = null;
          +    }
          +  }
          +
          +  Future<void> command(String method, Map args) async {
          +    try {
          +      await _ready.future;
          +    } catch (_) {
          +      return;
          +    }
          +    if (disposed) return;
          +    switch (method) {
          +      case 'play':
          +        await player.play();
          +        _event('playWhenReady', true);
          +      case 'pause':
          +        await player.pause();
          +        _event('playWhenReady', false);
          +      case 'seek':
          +        final ms = args['positionMs'];
          +        if (ms is num) await player.seek(Duration(milliseconds: ms.toInt()));
          +      case 'setRate':
          +        final rate = args['rate'];
          +        if (rate is num) await player.setRate(rate.toDouble());
          +      case 'setVolume':
          +        final volume = args['volume'];
          +        if (volume is num) {
          +          await player.setVolume(volume.toDouble().clamp(0, 1) * 100);
          +        }
          +    }
          +  }
          +
          +  Future<void> dispose() async {
          +    if (disposed) return;
          +    disposed = true;
          +    if (!_ready.isCompleted) _ready.complete();
          +    for (final subscription in _subscriptions) {
          +      await subscription.cancel();
          +    }
          +    try {
          +      await player.dispose();
          +    } finally {
          +      _media?.close();
          +      _media = null;
          +    }
          +  }
          +}
          PATCH_EOF
          echo "补丁行数: $(wc -l < "$PATCH")"
          git -c core.autocrlf=false apply --verbose "$PATCH"
          echo "--- 补丁生效检查 ---"
          grep -q "media_kit_libs_ios_video" pubspec.yaml && echo "pubspec OK"
          grep -q "isIOSPlatform" lib/pages/player_page.dart && echo "player_page OK"
          grep -q 'target_os = "ios"' rust/Cargo.toml && echo "cargo cfg OK"
          grep -q 'target_os = "ios"' rust/src/network.rs && echo "network cfg OK"
          test -f lib/services/ios_platform.dart && echo "ios_platform.dart OK"

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          echo "已安装的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sed -E 's#/Applications/Xcode(.*)\.app#\1#' \
            | sort -V | tail -1)
          if [ -z "${BEST}" ]; then echo "runner 上没有 Xcode"; exit 1; fi
          sudo xcode-select -s "/Applications/Xcode${BEST}.app/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}
          targets: aarch64-apple-ios

      - name: Cache cargo build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ios-cargo-${{ inputs.rust_version }}-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/**/*.rs', 'src/rust/build.rs') }}
          restore-keys: |
            ios-cargo-${{ inputs.rust_version }}-

      # 新版 Xcode + Swift Package Manager 有已知构建失败，上游 IOS.md 要求关掉。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager || echo "该 Flutter 版本不支持此开关，跳过"

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Resolve Dart dependencies
        run: |
          set -euo pipefail
          # 补丁改了 pubspec，lock 必然对不上，直接走普通 pub get 更新 lock。
          flutter pub get || { echo "pub get 失败"; exit 1; }

      # 把编译错误挡在昂贵的 Rust / Xcode 步骤之前，省 10 分钟。
      - name: Analyze touched Dart files
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/services/ios_platform.dart \
            lib/services/desktop_media.dart \
            lib/main.dart

      # Rust 核心编成 staticlib → ios/Frameworks/libfqapi_core.a
      # 补丁放开了 desktop_media 在 iOS 上编译，C 解密核心（sp_stream / mp4_cenc）
      # 由 build.rs 一并编进来。
      - name: Build Rust core as iOS static library
        run: |
          set -euo pipefail
          chmod +x scripts/build_rust_ios.sh
          ./scripts/build_rust_ios.sh

      - name: Verify the static library
        run: |
          set -euo pipefail
          lipo -info ios/Frameworks/libfqapi_core.a
          size=$(stat -f%z ios/Frameworks/libfqapi_core.a)
          echo "libfqapi_core.a = ${size} bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "静态库异常偏小，Rust 构建没真正产出"; exit 1
          fi

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update 2>&1 | tail -40

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ../build-ios.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "Runner.app 不存在，构建失败"; exit 1; }
          # 主二进制里必须能找到 Rust 入口，找不到就是白屏。
          nm -gU "$APP/Runner" 2>/dev/null | grep -qi "frb\|fqapi" \
            || { echo "主二进制缺少 frb/fqapi 导出符号"; exit 1; }
          rm -rf /tmp/pack && mkdir -p /tmp/pack/Payload
          ditto "$APP" /tmp/pack/Payload/Runner.app
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          OUT="fqapp-ios-${VERSION}-full.ipa"
          (cd /tmp/pack && zip -qry "$OLDPWD/$OUT" Payload)
          ls -lh "$OUT"
          shasum -a 256 "$OUT" | tee SHA256SUMS.txt
          echo "IPA=src/$OUT" >> "$GITHUB_ENV"

      - name: Report build fingerprint
        run: |
          set -euo pipefail
          echo "source:  ${{ inputs.source_repo }}@${{ inputs.source_ref }} + ios-full.patch"
          echo "flutter: $(flutter --version | head -1)"
          echo "rustc:   $(rustc --version)"
          echo "xcode:   $(xcodebuild -version | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-ios-unsigned-ipa
          path: |
            ${{ env.IPA }}
            src/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build-ios.log
            src/build/ios/**/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
