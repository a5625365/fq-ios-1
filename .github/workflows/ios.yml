name: Build iOS IPA

# 在 GitHub 的 macOS runner 上构建可自签安装的 iPhone 版 fqapp（什锦铺）。
#
# 做法：把上游 ch6vip/fqapp 直接拉进 src/ 构建，最后产出一个未签名 IPA。
#
# 2026-11-23 起不再打补丁：上游从 11-19 开始把 iOS 支持合并进主干
# （IosPlatform 进程内适配层、media_kit_libs_ios_video、Rust 的 ios cfg、
# scripts/build_rust_ios.sh、Info.plist 的后台音频模式都已自带），原先那份
# 1148 行 fqapp-ios-full.patch 全部内容已被上游吸收，再套用只会冲突。
# 本目录只需要一个文件：
#   .github/workflows/ios.yml   本文件
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 上游仓库（换成分支/自己的 fork 也可以）
        type: string
        default: 'ch6vip/fqapp'
      source_ref:
        # 钉在包含短剧取流修复的提交：97c148d3 = PR #471（取流签名信封对齐官方
        # 抓包 + 官方 video_model 门 + 空档位跳门恢复）、#472（脱敏媒体诊断）、
        # #473（首帧前静默重新取流）。浮动分支会让每次构建不可复现，所以钉死；
        # 上游再发取流修复时只改这一行。
        description: 分支、tag 或提交 SHA（默认钉在含取流修复的提交）
        type: string
        default: '97c148d31639ee46833c1d2a5617a38c9e7fa08a'
      flutter_version:
        description: Flutter 版本（pubspec.lock 要求 >=3.47.0）
        type: string
        default: '3.50.0'
      rust_version:
        description: Rust 工具链版本
        type: string
        default: '1.99.1'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      # 不再套补丁，直接拉上游源码构建。
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: src
          persist-credentials: false

      # 上游自带 iOS 支持，这里只守卫「上游还没把它删掉」：
      # 任一检查失败就早停，别等到昂贵的 Rust/Xcode 阶段才炸。
      - name: Verify upstream iOS support
        run: |
          set -euo pipefail
          fail() { echo "上游缺少 iOS 支持：$1"; exit 1; }
          grep -q "media_kit_libs_ios_video" pubspec.yaml || fail "pubspec 没有 media_kit_libs_ios_video"
          grep -q "IosPlatform.install()" lib/main.dart || fail "main.dart 未安装 IosPlatform"
          test -f lib/services/ios_platform.dart || fail "缺 lib/services/ios_platform.dart"
          grep -q 'target_os = "ios"' rust/Cargo.toml || fail "rust/Cargo.toml 缺 ios cfg"
          grep -q '"ios"' rust/build.rs || fail "rust/build.rs 缺 ios 分支"
          grep -q "UIBackgroundModes" ios/Runner/Info.plist || fail "Info.plist 缺 UIBackgroundModes"
          test -f scripts/build_rust_ios.sh || fail "缺 scripts/build_rust_ios.sh"
          echo "上游 iOS 支持检查通过"

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          echo "已安装的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null \
            | sed -E 's#/Applications/Xcode(.*)\.app#\1#' \
            | sort -V | tail -1)
          if [ -z "${BEST}" ]; then echo "runner 上没有 Xcode"; exit 1; fi
          sudo xcode-select -s "/Applications/Xcode${BEST}.app/Contents/Developer"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}
          targets: aarch64-apple-ios

      - name: Cache cargo build directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ios-cargo-${{ inputs.rust_version }}-${{ hashFiles('src/rust/Cargo.lock', 'src/rust/**/*.rs', 'src/rust/build.rs') }}
          restore-keys: |
            ios-cargo-${{ inputs.rust_version }}-

      # 新版 Xcode + Swift Package Manager 有已知构建失败，上游 IOS.md 要求关掉。
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager || echo "该 Flutter 版本不支持此开关，跳过"

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Resolve Dart dependencies
        run: |
          set -euo pipefail
          # pubspec.lock 可能与 source_ref 的 pubspec 对不上，走普通 pub get 更新。
          flutter pub get || { echo "pub get 失败"; exit 1; }

      # 把编译错误挡在昂贵的 Rust / Xcode 步骤之前，省 10 分钟。
      - name: Analyze touched Dart files
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/services/ios_platform.dart \
            lib/services/ios_audio_session.dart \
            lib/services/desktop_media.dart \
            lib/services/native_player.dart \
            lib/services/native_secure_key_storage.dart \
            lib/services/playback_issue.dart \
            lib/services/audio_playback_controller.dart \
            lib/main.dart

      # Rust 核心编成 staticlib → ios/Frameworks/<sdk>/libfqapi_core.a
      # 上游的 build.rs 已在 iOS 上编入 C 解密核心（sp_stream / mp4_cenc），
      # desktop_media 的 ios cfg 也由上游维护。
      - name: Build Rust core as iOS static library
        run: |
          set -euo pipefail
          chmod +x scripts/build_rust_ios.sh
          ./scripts/build_rust_ios.sh

      - name: Verify the static library
        run: |
          set -euo pipefail
          LIB=$(find ios/Frameworks -name 'libfqapi_core.a' -print -quit)
          test -n "$LIB" || { echo "没找到 libfqapi_core.a"; exit 1; }
          lipo -info "$LIB"
          size=$(stat -f%z "$LIB")
          echo "$LIB = ${size} bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "静态库异常偏小，Rust 构建没真正产出"; exit 1
          fi

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update 2>&1 | tail -40

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ../build-ios.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "Runner.app 不存在，构建失败"; exit 1; }
          # 主二进制里必须能找到 Rust 入口，找不到就是白屏。
          nm -gU "$APP/Runner" 2>/dev/null | grep -qi "frb\|fqapi" \
            || { echo "主二进制缺少 frb/fqapi 导出符号"; exit 1; }
          rm -rf /tmp/pack && mkdir -p /tmp/pack/Payload
          ditto "$APP" /tmp/pack/Payload/Runner.app
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          OUT="fqapp-ios-${VERSION}-full.ipa"
          (cd /tmp/pack && zip -qry "$OLDPWD/$OUT" Payload)
          ls -lh "$OUT"
          shasum -a 256 "$OUT" | tee SHA256SUMS.txt
          echo "IPA=src/$OUT" >> "$GITHUB_ENV"

      - name: Report build fingerprint
        run: |
          set -euo pipefail
          echo "source:  ${{ inputs.source_repo }}@${{ inputs.source_ref }}（上游直编，无补丁）"
          echo "flutter: $(flutter --version | head -1)"
          echo "rustc:   $(rustc --version)"
          echo "xcode:   $(xcodebuild -version | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-ios-unsigned-ipa
          path: |
            ${{ env.IPA }}
            src/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            build-ios.log
            src/build/ios/**/*.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
